  source_type: network_public_price_observation
  scope: default_downrank_reference_only
  notes:
  - CPU uses explicit daily low price floors only; it does not use same-model outlier
    grouping.
  - Floors are lower-bound trust references used for ranking and warnings, never hard
    filters or upper price caps.
  - Default builds prefer at-or-above-floor candidates; below-floor candidates remain
    available for budget or broad-market fallback.
  - A below-floor quote in the lowest 10% of its same-spec price group is further
    downranked and not recommended unless the user names it explicitly.
  - GPU floors use the daily-low column, not the historical-low column or trend chart
    endpoint.
  - RTX 5090, RTX 5090D and RTX 5090D V2 floors are temporarily cleared because those
    cards are moving too fast; always warn users to verify the current price.
  - Dated daily-low tables cover GPU, memory and storage on 2026-10-17; CPU retains
    its last explicit evidence on 2026-10-17.
  - Legacy GPU rows absent from the latest daily-low table retain their previous evidence;
    historical lows, second-hand prices and trend charts are not daily floors.
