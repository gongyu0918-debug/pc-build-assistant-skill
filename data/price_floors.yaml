  notes:
    - CPU uses explicit daily low price floors only; it does not use same-model outlier grouping.
    - Floors are lower-bound trust references for default recommendations, not upper price caps.
    - User-provided daily floor images cover current CPUs, GPUs, memory kits and SSDs on 2026-09-10.
    - GPU floors use the daily-low column, not the historical-low column or trend chart endpoint.
    - RTX 5090, RTX 5090D and RTX 5090D V2 floors are temporarily cleared because those cards are moving too fast; keeping a stale floor would distort default GPU filtering.
    - Legacy GPU rows not present in the 2026-09-10 daily-low table retain their last explicit lower-bound evidence; average transaction prices and trend charts are not transcribed as daily floors.
