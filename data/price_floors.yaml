  source_type: network_public_price_observation
  scope: default_downrank_reference_only
  notes:
    - CPU uses explicit daily low price floors only; it does not use same-model outlier grouping.
    - Floors are lower-bound trust references used for ranking and warnings, never hard filters or upper price caps.
    - Default builds prefer at-or-above-floor candidates; below-floor candidates remain available for budget or broad-market fallback.
    - A below-floor quote in the lowest 10% of its same-spec price group is further downranked and not recommended unless the user names it explicitly.
    - User-provided daily floor images cover current CPUs, GPUs, memory kits and SSDs on 2026-09-15.
    - GPU floors use the daily-low column, not the historical-low column or trend chart endpoint.
    - RTX 5090, RTX 5090D and RTX 5090D V2 floors are temporarily cleared because those cards are moving too fast; always warn users to verify the current price.
    - Legacy GPU rows not present in the 2026-09-15 daily-low table retain their last explicit lower-bound evidence; average transaction prices and trend charts are not transcribed as daily floors.
